# ── FLEXORI — Netlify Configuration ──

[build]
  publish = "."
  functions = "netlify/functions"

# ── SCHEDULED FUNCTIONS ──
[functions."weekly-jobs"]
  schedule = "0 9 * * 1"

# Seguimiento a 14 días — PAUSADO para caber en el plan Free de Resend (100 envíos/día).
# Reactivar quitando el # cuando se vuelva a Pro.
# [functions."followup-cron"]
#   schedule = "0 10 * * *"

# Reactivación por lotes — PAUSADO para caber en el plan Free de Resend.
# Campaña temporal para usuarios viejos; reactivar solo si hace falta.
# [functions."reactivation-batch"]
#   schedule = "0 6,14,22 * * *"

# ── WEBHOOK FUNCTION ──
[functions."stripe-webhook"]
  included_files = []

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# ── SECURITY HEADERS ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"


# ── 404 PAGE ──
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
